<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Connectly — Login</title>
    <style>
        body { background: #f0f2f5; font-family: sans-serif; display: grid; place-items: center; height: 100vh; margin: 0; }
        .box { background: #fff; padding: 30px; border-radius: 8px; width: 350px; box-shadow: 0 4px 12px #0002; text-align: center; }
        input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; margin: 10px 0; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .login-btn { background: #1877f2; color: #fff; }
        .google-btn { background: #4285f4; color: #fff; }
    </style>
</head>
<body>
    <div class="box">
        <h1>Connectly</h1>
        <input type="text" id="email" placeholder="Email or Phone">
        <input type="password" id="pass" placeholder="Password">
        <button class="login-btn" onclick="login()">Log In</button>
        <hr>
        <button class="google-btn" onclick="googleLogin()">Continue with Google</button>
    </div>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="app.js"></script>
</body>
</html>
